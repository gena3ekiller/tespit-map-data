name: Adventskalender
# Door N of the Tespit Advent calendar (1–24 December 2026) opens at a secret random time between 08:00 and
# 20:00 Europe/Berlin (07:00–19:00 UTC in December). Runs every 10 minutes in that window; advent_publish.py
# decides whether today's door is due and commits it.
on:
  schedule:
    - cron: "*/10 6-19 1-24 12 *"
  workflow_dispatch:
    inputs:
      check:
        description: "Only check the secrets (prints fingerprints, publishes nothing)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: advent
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography==44.0.0
      - name: Publish today's door if due
        env:
          ADVENT_KEY: ${{ secrets.ADVENT_KEY }}
          ADVENT_SEED: ${{ secrets.ADVENT_SEED }}
          ADVENT_CODES: ${{ secrets.ADVENT_CODES }}
        run: python3 advent_publish.py ${{ inputs.check && '--check' || '' }}
      - name: Commit
        run: |
          if [ -n "$(git status --porcelain advent)" ]; then
            git config user.name "tespit-advent"
            git config user.email "tespit-advent@users.noreply.github.com"
            git add advent
            git commit -m "Adventskalender: Türchen $(TZ=Europe/Berlin date +%-d)"
            git push
          fi
